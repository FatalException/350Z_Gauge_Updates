<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>350Z InfoGauge Update Portal</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #f0f0f0;
      text-align: center;
      padding: 50px 20px;
    }
    .card {
      max-width: 480px;
      margin: 0 auto;
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    button {
      background-color: #007bc7;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background-color: #005a92;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>350Z InfoGauge Firmware Update</h1>
    <p>Connect your gauge to your computer via USB, then click below using Chrome, Edge, or Brave.</p>

    <esp-web-install-button manifest="./manifest.json">
      <button slot="activate">Connect & Flash Gauge</button>
      <span slot="unsupported">Web Serial is not supported by your browser. Please use Google Chrome, Microsoft Edge, or Brave on Desktop.</span>
      <span slot="not-allowed">Web Serial requires HTTPS.</span>
    </esp-web-install-button>
  </div>
</body>
</html>
